name: Cloudflare public card lookup
on:
  pull_request:
    paths:
      - 'workers/card-library-public/**'
      - 'test/card-library-public.test.mjs'
      - '.github/workflows/card-library-public.yml'
  push:
    branches: [main]
    paths:
      - 'workers/card-library-public/**'
      - '.github/workflows/card-library-public.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check workers/card-library-public/worker.mjs
          node --test test/card-library-public.test.mjs
          npm test
