name: WidgetPhi Card Catalog Checks
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'cloudflare/**'
      - 'src/catalog.js'
      - 'test/catalog.test.js'
      - '.github/workflows/catalog-tests.yml'
  push:
    paths:
      - 'catalog/**'
      - 'cloudflare/**'
      - 'src/catalog.js'
      - 'test/catalog.test.js'
      - '.github/workflows/catalog-tests.yml'
permissions:
  contents: read
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check cloudflare/catalog-api.mjs
