name: WidgetPhi Media Star skills and D1
on:
  pull_request:
    paths:
      - 'src/media-curation.js'
      - 'src/widgets/media-star.js'
      - 'src/index.js'
      - 'catalog/media-star-player.js'
      - 'catalog/cards.json'
      - 'skills/**'
      - 'workers/media-star-tenants/**'
      - 'test/**'
      - '.github/workflows/media-star-skills.yml'
  push:
    branches: [main]
    paths:
      - 'src/media-curation.js'
      - 'src/widgets/media-star.js'
      - 'skills/**'
      - 'workers/media-star-tenants/**'
      - '.github/workflows/media-star-skills.yml'
permissions:
  contents: read
jobs:
  media-star:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check src/media-curation.js
          node --check src/widgets/media-star.js
          node --check catalog/media-star-player.js
      - name: Full WidgetPhi tests, tenant database and Media Star skills
        run: npm test
